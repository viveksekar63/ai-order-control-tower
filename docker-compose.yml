services:

  postgres:
    image: postgres:16-alpine
    container_name: ai-order-control-tower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_control_tower
      POSTGRES_USER: control_tower
      POSTGRES_PASSWORD: control_tower_dev
    ports:
      - "5433:5432"
    volumes:
      - control_tower_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_tower -d order_control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-order-control-tower-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ai-order-control-tower-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: control_tower
      RABBITMQ_DEFAULT_PASS: control_tower_dev
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-order-control-tower-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: npm run start:dev

volumes:
  control_tower_pgdata:
